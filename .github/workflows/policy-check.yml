name: Infrastructure policy check

# Runs on every pull request, and can also be started by hand from the Actions tab.
on:
  pull_request:
  workflow_dispatch:

jobs:
  policy-check:
    name: policy-check
    runs-on: ubuntu-latest
    steps:
      - name: Get the code from this pull request
        uses: actions/checkout@v4

      - name: Check namespace requests against policy
        run: node policy-check.js
